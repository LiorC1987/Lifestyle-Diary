<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life Diary</title>
<meta name="theme-color" content="#F3F5F4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life Diary">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#F3F5F4; --border:#DDE3E0; --divider:#E8ECEA; --ink:#16201C; --muted:#56625C;
  --accent:#1F6F5C; --accent-dark:#17574A; --tint:#E3EFEA; --field:#7C8782; --warn:#B4500F; --dot:#5E9E8B;
  --r1:#EAF1EE; --r2:#CFE3DB; --r3:#A5CDBE; --r4:#2F7F6A; --r5:#17574A;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,p{margin:0}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.top{display:flex;align-items:center;gap:12px;padding:12px 0}
.top .titles{flex:1;min-width:0}
.overline{font-size:13px;font-weight:500;color:var(--muted)}
h1{font-size:26px;font-weight:600;line-height:1.15}
.icon-btn{flex:none;width:48px;height:48px;display:flex;align-items:center;justify-content:center;padding:0;border:1px solid var(--border);border-radius:10px;background:#fff}
.icon-btn:disabled{color:#B9C2BE}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px}
.card.flush{padding:0;overflow:hidden}
button.card{display:block;width:100%;text-align:left}
.label{font-size:13px;font-weight:600;color:var(--muted)}
.label.pad{padding:14px 14px 4px}
.big{font-size:24px;font-weight:600;line-height:1.25;margin-top:4px}
.cap{font-size:12px;color:var(--muted);line-height:1.5}
.row{display:flex;gap:8px}
.row>*{flex:1 1 0;min-width:0}
.row.wide{gap:12px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}
.seg{height:48px;padding:0 4px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn{height:48px;padding:0 14px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:14px;font-weight:600;white-space:nowrap}
.btn.tint{background:var(--tint);border-color:var(--accent);color:var(--accent-dark)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.block{display:block;width:100%}
.btn.plain{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{border-color:transparent;background:none;color:var(--warn)}
.btn:disabled{opacity:.5}
.line{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:8px 0;border:0;background:none;text-align:left}
.line + .line{border-top:1px solid var(--divider)}
.line .time{flex:none;width:44px;font-size:12px;color:var(--muted)}
.line .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.item{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 14px;border:0;background:none;text-align:left}
.item + .item, .item + .sep, .sep + .item{border-top:1px solid var(--divider)}
.item .grow{flex:1;min-width:0}
.item .title{font-size:14px;font-weight:600}
.item .sub{font-size:12px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.item.accent .title{color:var(--accent-dark)}
.item.sep{border-top:1px solid var(--divider)}
.seg:has(input:checked){border-color:var(--accent);background:var(--tint);color:var(--accent-dark);font-weight:600}
.item:disabled .title{color:var(--muted)}
.strong{font-weight:600}
.thumb{flex:none;width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--tint)}
.photo-btn{display:block;width:100%;padding:0;border:0;background:none}
.photo-preview{display:block;width:100%;max-height:260px;border-radius:10px;object-fit:cover;background:var(--tint)}
.viewer{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:0;border:0;background:rgba(0,0,0,.92)}
.viewer img{max-width:100%;max-height:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;height:48px;padding:0 14px;border:0;border-radius:10px;background:var(--tint);color:var(--accent-dark);font-size:14px;font-weight:500;white-space:nowrap}
.chips .seg{flex:none;padding:0 14px}
.switch{flex:none;width:56px;height:48px;padding:0;border:0;background:none;display:flex;align-items:center;justify-content:center}
.switch span{width:46px;height:26px;padding:3px;border-radius:13px;background:var(--field);display:flex;justify-content:flex-start}
.switch span::after{content:"";width:20px;height:20px;border-radius:50%;background:#fff}
.switch[aria-checked="true"] span{background:var(--accent);justify-content:flex-end}
.value-btn{display:block;width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:#fff;text-align:left;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.value-btn.filled{background:var(--tint);color:var(--accent-dark);font-weight:600}
.banner{display:block;width:100%;padding:12px 14px;border:1px solid var(--accent);border-radius:12px;background:var(--tint);color:var(--accent-dark);font-size:13px;font-weight:600;text-align:left;line-height:1.45}
.banner.note{border-color:var(--border);background:#fff;color:var(--ink);font-weight:400}
.weekdays,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.weekdays{font-size:12px;font-weight:500;color:var(--muted);text-align:center}
.day{height:44px;padding:0;border:1px solid var(--divider);border-radius:10px;background:#fff;color:var(--muted);font-size:14px;font-weight:500}
.day:disabled{color:#B9C2BE}
.day.l1{background:var(--r1);border-color:transparent;color:var(--ink)}
.day.l2{background:var(--r2);border-color:transparent;color:var(--ink)}
.day.l3{background:var(--r3);border-color:transparent;color:var(--ink)}
.day.l4{background:var(--r4);border-color:transparent;color:#fff}
.day.l5{background:var(--r5);border-color:transparent;color:#fff}
.day.today{border:2px solid var(--ink);font-weight:600}
.legend{display:flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:18px;height:12px;border-radius:3px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.week .col{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.bar-box{width:100%;height:112px;display:flex;align-items:flex-end}
.bar{width:100%;border-radius:6px 6px 2px 2px;background:var(--r3)}
.bar.low{background:var(--warn)}
.mood-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border:1px solid var(--divider);color:var(--muted)}
.mood-dot.l1{background:var(--r1);border-color:transparent;color:var(--ink)}
.mood-dot.l2{background:var(--r2);border-color:transparent;color:var(--ink)}
.mood-dot.l3{background:var(--r3);border-color:transparent;color:var(--ink)}
.mood-dot.l4{background:var(--r4);border-color:transparent;color:#fff}
.mood-dot.l5{background:var(--r5);border-color:transparent;color:#fff}
.month{display:flex;gap:2px}
.month .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.month .bar{border-radius:2px}
.month .pip{width:7px;height:7px;border-radius:50%}
.spread{display:flex;justify-content:space-between}
.fig{display:flex;align-items:center;gap:12px;padding:12px 14px}
.fig + .fig{border-top:1px solid var(--divider)}
.fig .grow{flex:1}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.tabs .inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;border:0;background:none;font-size:12px;font-weight:500;color:var(--muted)}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.scrim{position:fixed;inset:0;z-index:10;background:rgba(22,32,28,.5)}
.sheet{position:fixed;z-index:11;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 20px);width:min(448px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:16px;background:#fff}
.sheet h2{font-size:20px;font-weight:600}
.sheet-actions{display:flex;justify-content:flex-end;gap:4px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea{width:100%;min-height:48px;padding:12px;border:1px solid var(--field);border-radius:10px;background:#fff;font-size:16px;font-weight:400;color:var(--ink)}
.field textarea{min-height:140px;resize:vertical}
#toast{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 80px);max-width:calc(100% - 32px);padding:12px 16px;border-radius:12px;background:var(--ink);color:#fff;font-size:13px;display:none}
#toast.show{display:block}
svg{display:block}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" aria-label="Main"><div class="inner" id="tabs"></div></nav>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input id="restore-file" type="file" accept="application/json,.json" hidden>
<script src="config.js"></script>
<script>
(function () {
'use strict';

/* ------------------------------------------------------------------ setup */

var CFG = window.LIFE_DIARY_CONFIG || {};
var CLIENT_ID = String(CFG.googleClientId || '').trim();
var PREVIEW = !!CFG.preview;   // a try-out copy where files cannot be saved and data is not kept safely
var APP_TAG = 'LifeDiary';
var COLLECTIONS = ['moods', 'sleeps', 'weights', 'meals', 'activities', 'notes', 'customTrackers', 'customValues', 'settings'];
var MOODS = ['Low', 'Meh', 'OK', 'Good', 'Great'];
var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

var KEYS = {
  FOOD: 'tracker.food', MOOD: 'tracker.mood', SLEEP: 'tracker.sleep', WEIGHT: 'tracker.weight',
  ACTIVITY: 'tracker.activity', DREAMS: 'tracker.dreams', THOUGHTS: 'tracker.thoughts'
};
var DEFAULTS = {};
DEFAULTS[KEYS.FOOD] = '1'; DEFAULTS[KEYS.MOOD] = '1'; DEFAULTS[KEYS.SLEEP] = '1'; DEFAULTS[KEYS.WEIGHT] = '1';
DEFAULTS[KEYS.ACTIVITY] = '1'; DEFAULTS[KEYS.DREAMS] = '0'; DEFAULTS[KEYS.THOUGHTS] = '1';

var BUILT_IN = [
  [KEYS.FOOD, 'Food', 'A line of text or a photo per meal'],
  [KEYS.MOOD, 'Mood', 'One tap, five levels'],
  [KEYS.SLEEP, 'Sleep', 'Hours slept, entered by hand'],
  [KEYS.WEIGHT, 'Weight', 'Typed in, with date and time'],
  [KEYS.ACTIVITY, 'Activity', 'What you did and for how long'],
  [KEYS.DREAMS, 'Dreams', 'Free text, best written on waking'],
  [KEYS.THOUGHTS, 'Thoughts', 'A few lines about the day']
];
var TRACKER_TYPES = [['number', 'Number'], ['scale_1_5', 'Scale 1 to 5'], ['yes_no', 'Yes or no'], ['text', 'Text']];
var RANGES = [['week', 'Week', 7], ['month', 'Month', 30], ['quarter', '3 months', 90], ['year', 'Year', 365]];

/* ---------------------------------------------------------------- helpers */

function pad(n) { return String(n).padStart(2, '0'); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function isoOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseIso(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], 12); }
function todayIso() { return isoOf(new Date()); }
function addDays(iso, n) { var d = parseIso(iso); d.setDate(d.getDate() + n); return isoOf(d); }
function daysBetween(a, b) { return Math.round((parseIso(b) - parseIso(a)) / 86400000); }
function dayMonth(iso) { var d = parseIso(iso); return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function shortDate(iso) { var d = parseIso(iso); return d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3); }
function weekdayName(iso) { return DAYS[parseIso(iso).getDay()]; }
function shortWeekday(iso) { return weekdayName(iso).slice(0, 3); }
function shortDay(iso) { return shortWeekday(iso) + ' ' + dayMonth(iso); }
function monthStart(ym) { return ym + '-01'; }
function monthEnd(ym) { var p = ym.split('-').map(Number); return ym + '-' + pad(new Date(p[0], p[1], 0).getDate()); }
function addMonths(ym, n) { var p = ym.split('-').map(Number); var d = new Date(p[0], p[1] - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function monthYear(ym) { var p = ym.split('-').map(Number); return MONTHS[p[1] - 1] + ' ' + p[0]; }
function sundayOf(iso) { return addDays(iso, -parseIso(iso).getDay()); }
function nowHHMM() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

/* Every entry stores the phone's UTC offset at the time, e.g. "+07:00", so the
   clock time it shows never changes when the phone moves to another time zone. */
function currentOffset() {
  var m = -new Date().getTimezoneOffset();
  if (m === 0) return 'Z';
  var a = Math.abs(m);
  return (m < 0 ? '-' : '+') + pad(Math.floor(a / 60)) + ':' + pad(a % 60);
}
function offsetMinutes(id) {
  var m = /^([+-])(\d\d):?(\d\d)/.exec(id || '');
  return m ? (m[1] === '-' ? -1 : 1) * (Number(m[2]) * 60 + Number(m[3])) : 0;
}
function toEpoch(iso, hhmm, offset) {
  var p = iso.split('-').map(Number), t = hhmm.split(':').map(Number);
  return Date.UTC(p[0], p[1] - 1, p[2], t[0], t[1]) - offsetMinutes(offset) * 60000;
}
function timeOf(ms, offset) {
  var d = new Date(ms + offsetMinutes(offset) * 60000);
  return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes());
}

function fmtDuration(min) { return Math.floor(min / 60) + 'h ' + pad(min % 60) + 'm'; }
function fmt1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
function fmtKg(kg) { return fmt1(kg) + ' kg'; }
function fmtNumber(v) { return v === Math.floor(v) ? String(v) : fmt1(v); }
function parseNumber(s) { var v = parseFloat(String(s).trim().replace(',', '.')); return isFinite(v) ? v : null; }
function average(xs) { return xs.reduce(function (a, b) { return a + b; }, 0) / xs.length; }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

function relativeDay(entryIso, referenceIso, time) {
  var days = daysBetween(entryIso, referenceIso);
  var suffix = time ? ', ' + time : '';
  var isToday = referenceIso === todayIso();
  if (days === 0) return (isToday ? 'Today' : 'This day') + suffix;
  if (days === 1) return (isToday ? 'Yesterday' : 'The day before') + suffix;
  return days + ' days ' + (isToday ? 'ago' : 'earlier');
}
function rangeLabel(start, end) {
  if (start === end) return weekdayName(start) + ' ' + dayMonth(start);
  if (start.slice(0, 7) === end.slice(0, 7)) return parseIso(start).getDate() + ' to ' + dayMonth(end);
  return dayMonth(start) + ' to ' + dayMonth(end);
}
function agoLabel(ms) {
  if (!ms) return 'never';
  var min = Math.round((Date.now() - ms) / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return plural(min, 'minute', 'minutes') + ' ago';
  if (min < 1440) return plural(Math.round(min / 60), 'hour', 'hours') + ' ago';
  return plural(Math.round(min / 1440), 'day', 'days') + ' ago';
}

/* Small values (screen state, sync details) live in localStorage; it can be
   unavailable in some browsers, so every access is guarded. */
var memoryPrefs = {};
function lsGet(key, fallback) {
  try { var t = localStorage.getItem(key); return t == null ? fallback : JSON.parse(t); }
  catch (e) { return key in memoryPrefs ? memoryPrefs[key] : fallback; }
}
function lsSet(key, value) {
  memoryPrefs[key] = value;
  try { if (value == null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(value)); }
  catch (e) { /* kept in memory only */ }
}

var ICON = {
  left: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  right: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  back: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  chev: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#56625C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  today: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
  history: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  summary: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>',
  trackers: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>'
};

/* ------------------------------------------------------------------ data */

function emptyState() {
  var s = { app: APP_TAG, version: 1, modifiedAt: 0 };
  COLLECTIONS.forEach(function (k) { s[k] = []; });
  return s;
}
/* Accepts a diary from storage, a backup file (from this app or the Android app) or Google Drive. */
function normalize(obj) {
  var s = emptyState();
  COLLECTIONS.forEach(function (k) { if (obj && Array.isArray(obj[k])) s[k] = obj[k]; });
  s.modifiedAt = Number(obj && (obj.modifiedAt || obj.exportedAt)) || Date.now();
  return s;
}
function isEmpty(s) {
  return COLLECTIONS.every(function (k) { return k === 'settings' || s[k].length === 0; });
}
function daysWithEntries(s) {
  var set = {};
  ['moods', 'sleeps', 'weights', 'meals', 'activities', 'notes', 'customValues'].forEach(function (k) {
    s[k].forEach(function (e) { set[e.localDate] = 1; });
  });
  return Object.keys(set).length;
}

/* The diary itself is kept in the browser's database (IndexedDB), falling back
   to localStorage, then to memory only. */
var Store = (function () {
  var backend = 'memory', db = null, pending = Promise.resolve(), mem = {};
  function openDb() {
    return new Promise(function (resolve, reject) {
      var req;
      try { req = indexedDB.open('life-diary', 1); } catch (e) { reject(e); return; }
      req.onupgradeneeded = function () { req.result.createObjectStore('kv'); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
      req.onblocked = function () { reject(new Error('blocked')); };
      setTimeout(function () { reject(new Error('timeout')); }, 3000);
    });
  }
  function idb(mode, run) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction('kv', mode), req = run(tx.objectStore('kv'));
      tx.oncomplete = function () { resolve(req.result); };
      tx.onerror = tx.onabort = function () { reject(tx.error); };
    });
  }
  function init() {
    return openDb().then(function (d) { db = d; backend = 'idb'; }).catch(function () {
      try { localStorage.setItem('ld.test', '1'); localStorage.removeItem('ld.test'); backend = 'ls'; }
      catch (e) { backend = 'memory'; }
    });
  }
  function load(key) {
    if (backend === 'idb') {

      loading[name] = Store.load('photo:' + name).then(function (url) {

var navDepth = 0, skipPop = 0, queuedPush = 0;

/* Pop-ups and the weight screen add a history entry, so the phone's Back button closes them.

/* ----------------------------------------------------------------- history */

function bucketize(values) {
  var keys = Object.keys(values), out = {};

  var nums = keys.map(function (k) { return values[k]; });
  var low = Math.min.apply(null, nums), high = Math.max.apply(null, nums);
  keys.forEach(function (k) {

  });

}

  return [['mood', 'Mood', KEYS.MOOD], ['sleep', 'Sleep', KEYS.SLEEP], ['weight', 'Weight', KEYS.WEIGHT], ['food', 'Food', KEYS.FOOD]]
    .filter(function (o) { return isOn(o[2]); });

  if (active === 'mood') {
    state.moods.filter(inMonth).forEach(function (e) { values[e.localDate] = Math.min(5, Math.max(1, e.level)); });
    return values;
  }
  if (active === 'sleep') state.sleeps.filter(inMonth).forEach(function (e) { values[e.localDate] = e.durationMinutes; });
  if (active === 'weight') sortedWeights().filter(inMonth).forEach(function (e) { values[e.localDate] = e.kg; });
  if (active === 'food') state.meals.filter(inMonth).forEach(function (e) { values[e.localDate] = (values[e.localDate] || 0) + 1; });
  return bucketize(values);
}

  var parts = [];
  var mood = state.moods.find(function (e) { return e.localDate === iso; });
  if (mood) parts.push('mood ' + MOODS[Math.min(4, Math.max(0, mood.level - 1))].toLowerCase());
  var sleep = state.sleeps.find(function (e) { return e.localDate === iso; });
  if (sleep) parts.push('slept ' + fmtDuration(sleep.durationMinutes));
  var meals = state.meals.filter(function (e) { return e.localDate === iso; }).length;
  if (meals) parts.push(plural(meals, 'meal', 'meals'));
  state.activities.filter(function (e) { return e.localDate === iso; }).forEach(function (a) { parts.push(a.name.toLowerCase()); });
  if (state.notes.some(function (n) { return n.localDate === iso && n.kind === 'dream'; })) parts.push('dream');
  if (state.notes.some(function (n) { return n.localDate === iso && n.kind === 'thought'; })) parts.push('thoughts');
  if (!parts.length) return '';

  return text.charAt(0).toUpperCase() + text.slice(1);
}

  var today = todayIso(), ym = ui.month, start = monthStart(ym), end = monthEnd(ym);
  var options = colourOptions();
  var active = (options.find(function (o) { return o[0] === ui.colourBy; }) || options[0] || [null])[0];
  var levels = active ? calendarLevels(active, start, end) : {};

    iconBtn('monthPrev', 'left', 'Previous month') + iconBtn('monthNext', 'right', 'Next month', ym >= today.slice(0, 7)));

  }

  html += '<section class="card"><div class="weekdays">' +
    DAYS.map(function (n) { return '<span>' + n.slice(0, 3) + '</span>'; }).join('') + '</div><div class="cal mt10">';
  for (var b = 0; b < parseIso(start).getDay(); b++) html += '<span></span>';
  for (var iso = start; iso <= end; iso = addDays(iso, 1)) {

/* ----------------------------------------------------------------- summary */

function figures(start, end) {
  var inRange = function (e) { return e.localDate >= start && e.localDate <= end; };
  var sleeps = state.sleeps.filter(inRange).map(function (e) { return e.durationMinutes; });
  var moods = state.moods.filter(inRange).map(function (e) { return e.level; });
  var weights = sortedWeights().filter(inRange);
  var acts = state.activities.filter(inRange);
  var activeDays = {};
  acts.forEach(function (a) { activeDays[a.localDate] = 1; });
  var change = weights.length > 1 ? Math.round((weights[weights.length - 1].kg - weights[0].kg) * 10) / 10 : null;
  return {
    sleepAvg: sleeps.length ? Math.round(average(sleeps)) : null,
    moodAvg: moods.length ? average(moods) : null,
    weights: weights, weightChange: change,
    meals: state.meals.filter(inRange).length,
    activeDays: Object.keys(activeDays).length,
    activityMinutes: acts.reduce(function (a, e) { return a + e.durationMinutes; }, 0)
  };
}
function changeText(change) {
  if (change > 0) return 'Up ' + fmtKg(change);
  if (change < 0) return 'Down ' + fmtKg(-change);
  return 'No change';
}
function figureRows(period, f) {
  var rows = [], isDay = period === 'day';
  if (isOn(KEYS.SLEEP)) rows.push([isDay ? 'Sleep' : 'Average sleep', f.sleepAvg == null ? 'No entries' : fmtDuration(f.sleepAvg)]);
  if (isOn(KEYS.MOOD)) {
    rows.push([isDay ? 'Mood' : 'Average mood', f.moodAvg == null ? 'No entries'
      : isDay ? MOODS[Math.round(f.moodAvg) - 1] : fmt1(f.moodAvg) + ' out of 5']);
  }
  if (isOn(KEYS.WEIGHT)) {
    rows.push(f.weights.length > 1 ? ['Weight, first to last weigh-in', changeText(f.weightChange)]
      : ['Weight', f.weights.length ? fmtKg(f.weights[0].kg) : 'No weigh-ins']);
  }
  if (isOn(KEYS.FOOD)) rows.push(['Meals logged', String(f.meals)]);
  if (isOn(KEYS.ACTIVITY)) {
    rows.push(isDay ? ['Activity', f.activityMinutes + ' min'] : ['Active days', f.activeDays + ', ' + f.activityMinutes + ' min in total']);
  }
  return rows;
}
function barHeight(minutes, stats) {
  var longest = Math.max.apply(null, stats.map(function (s) { return s.sleep || 0; }));
  return Math.max(4, Math.round(112 * minutes / Math.max(600, longest)));
}
function weekChart(stats, showSleep, showMood) {
  var slept = stats.filter(function (s) { return s.sleep != null; }).map(function (s) { return s.sleep; });
  var lowest = slept.length >= 2 ? Math.min.apply(null, slept) : null;
  return '<div class="week">' + stats.map(function (s) {
    var low = s.sleep != null && s.sleep === lowest;
    var col = '<div class="col">';
    if (showSleep) {
      col += '<span' + (low ? ' class="strong" style="color:var(--ink)"' : '') + '>' + (s.sleep != null ? fmt1(s.sleep / 60) : '–') + '</span>' +
        '<div class="bar-box">' + (s.sleep != null ? '<div class="bar' + (low ? ' low' : '') + '" style="height:' + barHeight(s.sleep, stats) + 'px"></div>' : '') + '</div>';
    }
    if (showMood) col += '<span class="mood-dot' + (s.mood ? ' l' + s.mood : '') + '">' + (s.mood || '–') + '</span>';
    return col + '<span>' + shortWeekday(s.date) + '</span></div>';
  }).join('') + '</div>';
}
function monthChart(stats, showSleep, showMood) {
  return '<div class="month">' + stats.map(function (s) {
    var col = '<div class="col">';
    if (showSleep) col += '<div class="bar-box">' + (s.sleep != null ? '<div class="bar" style="height:' + barHeight(s.sleep, stats) + 'px"></div>' : '') + '</div>';
    if (showMood) col += '<span class="pip" style="background:' + (s.mood ? 'var(--r' + s.mood + ')' : 'transparent') + '"></span>';
    return col + '</div>';
  }).join('') + '</div><div class="spread cap mt8"><span>' + shortDate(stats[0].date) + '</span><span>' +
    shortDate(stats[Math.floor(stats.length / 2)].date) + '</span><span>' + shortDate(stats[stats.length - 1].date) + '</span></div>';
}

function viewSummary() {
  var today = todayIso(), range = periodRange(ui.period, ui.anchor), start = range[0], end = range[1];
  var stats = dayStats(start, end), f = figures(start, end);
  var showSleep = isOn(KEYS.SLEEP), showMood = isOn(KEYS.MOOD);
  // Have a day's meal photos ready, so Share can send them the moment it is tapped.
  var dayPhotos = ui.period === 'day' ? dayPhotoNames(start) : [];
  dayPhotos.forEach(Photos.load);

  var html = header(rangeLabel(start, end), 'Summary', '',
    iconBtn('periodPrev', 'left', 'Previous period') + iconBtn('periodNext', 'right', 'Next period', end >= today));
  html += '<main class="stack">' + banners();
  html += '<div class="row" role="group" aria-label="Summary period">' +
    seg('period', 'day', 'Day', ui.period === 'day') + seg('period', 'week', 'Week', ui.period === 'week') +
    seg('period', 'month', 'Month', ui.period === 'month') + '</div>';

  if (ui.period !== 'day' && (showSleep || showMood)) {
    var hasData = stats.some(function (s) { return s.sleep != null || s.mood != null; });
    html += '<section class="card"><h2 class="label">' + (showSleep && showMood ? 'Sleep and mood' : showSleep ? 'Sleep' : 'Mood') + '</h2><div class="mt10">' +
      (!hasData ? '<p class="cap">No sleep or mood entries in this period yet.</p>'
        : ui.period === 'week' ? weekChart(stats, showSleep, showMood) : monthChart(stats, showSleep, showMood)) +
      '</div><p class="cap mt10">' +
      (showSleep && showMood ? 'Bars show hours of sleep. Circles show mood from 1 (low) to 5 (great).'
        : showSleep ? 'Bars show hours of sleep.' : 'Circles show mood from 1 (low) to 5 (great).') + '</p></section>';
  }

  var rows = figureRows(ui.period, f);
  html += '<section class="card flush"><h2 class="label pad">In numbers</h2>' +
    (rows.length ? rows.map(function (r) {
      return '<div class="fig"><span class="grow">' + r[0] + '</span><span class="strong">' + esc(r[1]) + '</span></div>';
    }).join('') : '<p class="cap" style="padding:0 14px 14px">All trackers are switched off.</p>') + '</section>';

  html += '<section class="card"><h2 class="label">Summary from Claude</h2>' +
    '<p class="mt8">Share this period as a report. It contains your entries, the figures above and instructions, so Claude can write what stood out and what is worth trying.</p>' +
    '<div class="row mt12">' + (PREVIEW ? '' : '<button class="btn primary" data-act="shareReport">Share report</button>') +
    '<button class="btn' + (PREVIEW ? ' primary' : '') + '" data-act="copyReport">Copy report</button></div>' +
    '<p class="cap mt10">Open the Claude app, attach or paste the report, and send it.' +
    (dayPhotos.length && !PREVIEW ? ' This day\'s meal photos are sent along with it; on a computer they are downloaded as separate files.' : '') + '</p></section>';
  return html + '</main>';
}

/* The Markdown report: instructions for Claude first, then figures, then every entry. */
function dayPhotoNames(iso) {
  return isOn(KEYS.FOOD) ? state.meals.filter(function (m) { return m.localDate === iso && photoOf(m); }).map(photoOf) : [];
}
/* attached: names of the photo files being sent together with the report, if any. */
function buildReport(attached) {
  attached = attached || [];
  var range = periodRange(ui.period, ui.anchor), start = range[0], end = range[1];
  var f = figures(start, end), year = parseIso(end).getFullYear();
  var prevEnd = addDays(start, -1), prevStart = periodRange(ui.period, prevEnd)[0];
  var prev = figures(prevStart, prevEnd);
  var L = [];
  L.push('# Life Diary report: ' + rangeLabel(start, end) + ' ' + year + ' (' + ui.period + ')', '');
  L.push('## Instructions for Claude', '');
  L.push('This is an export from my personal diary app. Please write a summary of this period for me.', '');
  L.push('- Start with a section called "What stood out": three to five sentences in plain, friendly language about patterns in the data, for example how sleep, mood, food, activity and weight moved together.');
  L.push('- Then a section called "Worth trying": one to three small, concrete suggestions that follow from those patterns.');
  L.push('- Use only the figures and entries below. Do not invent numbers. If there is too little data to see a pattern, say so plainly.');
  L.push('- Do not diagnose or give medical advice. If something looks worth raising with a doctor, say that in one sentence.');
  if (attached.length) L.push('- Photos of some meals are attached; each meal below names its photo file. Use them to see what was eaten where the text says little.');
  L.push('- Keep the whole summary under about 200 words. I may ask follow-up questions afterwards.', '');
  L.push('Mood is recorded on a scale from 1 (low) to 5 (great). Sleep is the time slept the night before each date. Weeks run Sunday to Saturday.', '');

  L.push('## Figures calculated by the app', '');
  figureRows(ui.period, f).forEach(function (r) { L.push('- ' + r[0] + ': ' + r[1]); });
  var prevRows = figureRows(ui.period, prev);
  if (prevRows.length) {
    L.push('', 'Previous ' + ui.period + ' (' + rangeLabel(prevStart, prevEnd) + '), for comparison:', '');
    prevRows.forEach(function (r) { L.push('- ' + r[0] + ': ' + r[1]); });
  }

  L.push('', '## Entries', '');
  for (var iso = start; iso <= end; iso = addDays(iso, 1)) {
    var lines = reportDay(iso, attached);
    L.push('### ' + weekdayName(iso) + ' ' + dayMonth(iso), '');
    if (lines.length) lines.forEach(function (l) { L.push(l); }); else L.push('- No entries');
    L.push('');
  }
  return L.join('\n');
}
function reportDay(iso, attached) {
  var out = [], on = function (e) { return e.localDate === iso; };
  var mood = state.moods.find(on);
  if (mood && isOn(KEYS.MOOD)) out.push('- Mood: ' + MOODS[mood.level - 1] + ' (' + mood.level + '/5)');
  var sleep = state.sleeps.find(on);
  if (sleep && isOn(KEYS.SLEEP)) out.push('- Sleep: ' + fmtDuration(sleep.durationMinutes));
  if (isOn(KEYS.WEIGHT)) sortedWeights().filter(on).forEach(function (w) { out.push('- Weight: ' + fmtKg(w.kg) + ' at ' + timeOf(w.measuredAt, w.zoneOffset)); });
  if (isOn(KEYS.FOOD)) {
    state.meals.filter(on).sort(function (a, b) { return a.eatenAt - b.eatenAt; })
      .forEach(function (m) {
        var photo = photoOf(m);
        var note = !photo ? '' : attached.indexOf(photo) >= 0 ? ' [photo attached: ' + photo + ']' : ' [has a photo in the diary, not attached]';
        out.push('- Meal at ' + timeOf(m.eatenAt, m.zoneOffset) + ': ' + (m.text ? oneLine(m.text) : '(no description)') + note);
      });
  }
  if (isOn(KEYS.ACTIVITY)) state.activities.filter(on).forEach(function (a) { out.push('- Activity: ' + oneLine(a.name) + ', ' + a.durationMinutes + ' min'); });
  state.notes.filter(on).forEach(function (n) {
    if (n.kind === 'dream' && isOn(KEYS.DREAMS)) out.push('- Dream: ' + oneLine(n.text));
    if (n.kind === 'thought' && isOn(KEYS.THOUGHTS)) out.push('- Thoughts: ' + oneLine(n.text));
  });
  state.customTrackers.filter(function (t) { return t.enabled; }).forEach(function (t) {
    var v = state.customValues.find(function (x) { return x.trackerId === t.id && x.localDate === iso; });
    if (!v) return;
    var text = t.type === 'text' ? oneLine(v.textValue || '') : t.type === 'yes_no' ? (v.numberValue === 1 ? 'yes' : 'no')
      : t.type === 'scale_1_5' ? v.numberValue + '/5' : fmtNumber(v.numberValue) + (t.unit ? ' ' + t.unit : '');
    out.push('- ' + oneLine(t.name) + ': ' + text);
  });
  return out;
}
function oneLine(s) { return String(s).replace(/\s*\n+\s*/g, ' / ').trim(); }

/* ---------------------------------------------------------------- trackers */

function viewTrackers() {
  var html = header('Choose what you log', 'Trackers') + '<main class="stack">' + banners();

  html += '<section class="card flush" aria-label="Trackers">';
  BUILT_IN.forEach(function (t) {
    html += '<div class="item"><span class="grow"><span class="title">' + t[1] + '</span><br><span class="sub">' + t[2] + '</span></span>' +
      switchBtn('toggle', t[0], t[1] + ' tracker', isOn(t[0])) + '</div>';
  });
  state.customTrackers.forEach(function (t) {
    var type = (TRACKER_TYPES.find(function (x) { return x[0] === t.type; }) || TRACKER_TYPES[0])[1];
    html += '<div class="item"><button class="grow" data-act="editTracker" data-id="' + t.id + '" style="border:0;background:none;padding:0;text-align:left">' +
      '<span class="title">' + esc(t.name) + '</span><br><span class="sub">' + type + (t.unit ? ', in ' + esc(t.unit) : '') + '. Tap to rename or delete</span></button>' +
      switchBtn('toggleCustom', t.id, t.name + ' tracker', t.enabled) + '</div>';
  });
  html += '<button class="item accent" data-act="addTracker"><span class="title">Add your own tracker</span></button></section>';

  html += '<section class="card flush" aria-label="Google Drive"><h2 class="label pad">Google Drive (optional)</h2>' + driveCard() + '</section>';

  var lastBackup = lsGet('ld.lastBackup', 0);
  html += '<section class="card flush" aria-label="Backup">' + (PREVIEW ? '' :
    '<button class="item" data-act="backup"><span class="grow"><span class="title">Back up diary</span><br><span class="sub">Save everything to a file. Last backup: ' + agoLabel(lastBackup) + '</span></span>' + ICON.chev + '</button>') +
    '<button class="item" data-act="restore"><span class="grow"><span class="title">Restore from backup</span><br><span class="sub">Replace this diary with a backup file</span></span>' + ICON.chev + '</button>' +
    (previousState ? '<button class="item" data-act="undoReplace"><span class="grow"><span class="title">Undo last replace</span><br><span class="sub">Bring back the diary as it was before the last restore or Drive download</span></span>' + ICON.chev + '</button>' : '') +
    '</section>';

  html += '<p class="cap">Your diary is stored on this device' + (Drive.linked() ? ' and in your Google Drive' : '') +
    '. Version 0.1.</p>';
  return html + '</main>';
}
function driveCard() {
  var pad14 = 'padding:4px 14px 14px';
  if (PREVIEW) return '<p class="cap" style="' + pad14 + '">Not available in this preview. It works once the app is hosted at its own address.</p>';
  if (!Drive.configured()) {
    return '<p class="cap" style="' + pad14 + '">Not set up on this copy of the app. Whoever hosts it needs to add a Google client ID first (see the README).</p>';
  }
  if (!Drive.linked()) {
    return '<div style="' + pad14 + '"><p>Keep a copy of your diary in your own Google Drive, so it survives a lost phone or cleared browser data. The app can only see the one file it creates.</p>' +
      '<button class="btn primary block mt12" data-act="driveConnect">Connect Google Drive</button></div>';
  }
  var m = Drive.meta();
  var status = Drive.busy() ? 'Syncing…'
    : Drive.needsSignIn() ? 'Paused: sign in to sync'
    : Drive.hasConflict() ? 'Two versions: tap Sync now to choose one'
    : Drive.error() ? 'Last sync failed: ' + Drive.error()
    : 'Last synced ' + agoLabel(m.lastSyncAt) + (m.dirty ? ', changes waiting' : '');
  return '<div style="' + pad14 + '"><p><span class="strong">' + (m.email ? 'Connected as ' + esc(m.email) : 'Connected') + '</span><br><span class="cap">' + esc(status) + '</span></p>' +
    '<div class="row mt12"><button class="btn primary" data-act="' + (Drive.needsSignIn() ? 'driveConnect' : 'driveSync') + '"' + (Drive.busy() ? ' disabled' : '') + '>' +
    (Drive.needsSignIn() ? 'Sign in' : 'Sync now') + '</button><button class="btn" data-act="driveDisconnect">Disconnect</button></div></div>' +
    '<div class="item sep"><span class="grow"><span class="title">Sign in when the app opens</span><br><span class="sub">Google sign-ins last about an hour. With this on, the app renews it at start so syncing needs no taps.</span></span>' +
    switchBtn('driveAuto', 'auto', 'Sign in when the app opens', m.auto) + '</div>';
}

/* ------------------------------------------------------------------ weight */

function rollingAverage(all, iso) {
  var from = addDays(iso, -6);
  var win = all.filter(function (w) { return w.localDate >= from && w.localDate <= iso; });
  return win.length ? average(win.map(function (w) { return w.kg; })) : null;
}
function viewWeight() {
  var today = todayIso(), all = sortedWeights();
  var days = (RANGES.find(function (r) { return r[0] === ui.weightRange; }) || RANGES[1])[2];
  var start = addDays(today, -(days - 1));
  var inRange = all.filter(function (w) { return w.localDate >= start && w.localDate <= today; });
  var avgDates = inRange.map(function (w) { return w.localDate; }).filter(function (d, i, a) { return a.indexOf(d) === i; });
  var averages = avgDates.map(function (d) { return { date: d, kg: rollingAverage(all, d) }; });
  var latest = all[all.length - 1];
  var latestAvg = latest ? rollingAverage(all, latest.localDate) : null;

  var html = header(rangeLabel(start, today), 'Weight', iconBtn('weightBack', 'back', 'Back to Today'));
  html += '<main class="stack"><div class="row" role="group" aria-label="Time range">' +
    RANGES.map(function (r) { return seg('weightRange', r[0], r[1], r[0] === ui.weightRange); }).join('') + '</div>';

  var changeLine = 'Needs weigh-ins on two days';
  if (averages.length >= 2) {
    var change = Math.round((averages[averages.length - 1].kg - averages[0].kg) * 10) / 10;
    changeLine = changeText(change) + ' since ' + shortDate(averages[0].date);
  }
  html += '<section class="card"><div class="row wide"><div><div class="label">Latest</div><div class="big">' + (latest ? fmtKg(latest.kg) : 'None yet') +
    '</div><div class="cap">' + (latest ? relativeDay(latest.localDate, today, timeOf(latest.measuredAt, latest.zoneOffset)) : 'Add your first weigh-in') +
    '</div></div><div><div class="label">7-day average</div><div class="big">' + (latestAvg != null ? fmtKg(latestAvg) : '–') +
    '</div><div class="cap">' + changeLine + '</div></div></div></section>';

  html += '<section class="card"><h2 class="label">Trend</h2><div class="mt10">' +
    (inRange.length ? trendChart(start, today, inRange, averages) + '<p class="cap mt8">Dots are single weigh-ins. The line is the 7-day average.</p>'
      : '<p class="cap">No weigh-ins in this period yet.</p>') + '</div></section>';

  if (inRange.length) {
    html += '<section class="card flush"><h2 class="label pad">Weigh-ins</h2>' + inRange.slice().reverse().map(function (w) {
      return '<button class="item" style="min-height:48px" data-act="editWeight" data-id="' + w.id + '"><span class="grow">' + shortDay(w.localDate) + ', ' +
        timeOf(w.measuredAt, w.zoneOffset) + '</span><span class="strong">' + fmtKg(w.kg) + '</span></button>';
    }).join('') + '</section>';
  }
  return html + '<button class="btn primary block" data-act="addWeight">Add weigh-in</button></main>';
}
function trendChart(start, end, dots, averages) {
  var values = dots.map(function (w) { return w.kg; }).concat(averages.map(function (a) { return a.kg; }));
  var low = Math.floor(Math.min.apply(null, values) - 0.2), high = Math.ceil(Math.max.apply(null, values) + 0.2);
  if (high - low < 1) high = low + 1;
  var span = daysBetween(start, end);
  var x = function (iso) { return 44 + (span <= 0 ? 0.5 : daysBetween(start, iso) / span) * 278; };
  var y = function (kg) { return 14 + (1 - (kg - low) / (high - low)) * 132; };
  var svg = '<svg role="img" aria-label="Weight trend from ' + shortDate(start) + ' to ' + shortDate(end) + '" viewBox="0 0 330 172" style="width:100%;height:auto">' +
    '<g stroke="#E8ECEA" stroke-width="1"><path d="M40 14H326"/><path d="M40 80H326"/><path d="M40 146H326"/></g>' +
    '<g fill="#56625C" font-size="12" font-family="inherit"><text x="0" y="18">' + fmtNumber(high) + ' kg</text><text x="0" y="84">' + fmtNumber((low + high) / 2) +
    '</text><text x="0" y="150">' + fmtNumber(low) + '</text><text x="40" y="168">' + shortDate(start) + '</text><text x="326" y="168" text-anchor="end">' + shortDate(end) + '</text></g><g fill="#5E9E8B">';
  dots.forEach(function (w) { svg += '<circle cx="' + x(w.localDate).toFixed(1) + '" cy="' + y(w.kg).toFixed(1) + '" r="3"/>'; });
  svg += '</g>';
  if (averages.length >= 2) {
    svg += '<polyline fill="none" stroke="#17574A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="' +
      averages.map(function (a) { return x(a.date).toFixed(1) + ',' + y(a.kg).toFixed(1); }).join(' ') + '"/>';
  }
  return svg + '</svg>';
}

/* ------------------------------------------------------------------ render */

function render() {
  var view = ui.tab === 'today' ? (ui.showWeight ? viewWeight() : viewToday())
    : ui.tab === 'history' ? viewHistory() : ui.tab === 'summary' ? viewSummary() : viewTrackers();
  document.getElementById('app').innerHTML = view;
  document.getElementById('tabs').innerHTML = [['today', 'Today'], ['history', 'History'], ['summary', 'Summary'], ['trackers', 'Trackers']]
    .map(function (t) {
      return '<button class="tab" data-act="tab" data-val="' + t[0] + '"' + (ui.tab === t[0] ? ' aria-current="page"' : '') + '>' + ICON[t[0]] + '<span>' + t[1] + '</span></button>';
    }).join('');
}

/* ------------------------------------------------------------------ sheets */

function field(label, input) { return '<label class="field">' + esc(label) + input + '</label>'; }

/* Opens a pop-up form. onSubmit receives the form's values; return false to keep it open. */
function openSheet(opts) {
  sheet = opts;
  var buttons = (opts.extraLabel ? '<button type="button" class="btn danger" data-act="sheetExtra">' + esc(opts.extraLabel) + '</button>' : '') +
    '<button type="button" class="btn plain" data-act="closeSheet">' + (opts.onSubmit ? 'Cancel' : 'Close') + '</button>' +
    (opts.onSubmit ? '<button type="submit" class="btn primary">' + esc(opts.saveLabel || 'Save') + '</button>' : '');
  document.getElementById('sheet-root').innerHTML = '<div class="scrim" data-act="closeSheet"></div>' +
    '<form class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" novalidate><h2 id="sheet-title">' + esc(opts.title) + '</h2>' +
    opts.body + '<div class="sheet-actions">' + buttons + '</div></form>';
  pushNav();
  var first = document.querySelector('.sheet input, .sheet textarea');
  if (first && opts.autofocus !== false) first.focus();
}
function dropSheet() {
  var closing = sheet;
  sheet = null;
  document.getElementById('sheet-root').innerHTML = '';
  if (closing && closing.onClose) closing.onClose();
}
function closeSheet() { if (sheet) { dropSheet(); leaveNav(); } }

document.addEventListener('submit', function (e) {
  e.preventDefault();
  if (!sheet || !sheet.onSubmit) return;
  var form = e.target;
  if (!form.checkValidity()) { form.reportValidity(); return; }
  var data = {};
  new FormData(form).forEach(function (v, k) { data[k] = String(v); });
  if (sheet.onSubmit(data) !== false) closeSheet();
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (viewerOpen) closeViewer(); else if (sheet) closeSheet();
});

function confirmSheet(title, message, label, onConfirm) {
  openSheet({ title: title, body: '<p>' + esc(message) + '</p>', saveLabel: label, autofocus: false, onSubmit: function () { onConfirm(); } });
}

function sleepSheet() {
  var d = ui.date, cur = state.sleeps.find(function (e) { return e.localDate === d; });
  openSheet({
    title: 'Sleep',

/* ------------------------------------------------------- files and sharing */

function isTouch() { return !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches); }

function saveFile(name, mime, text) {
  var file = null;

  if (file && isTouch() && navigator.canShare && navigator.canShare({ files: [file] })) {

      if (err && err.name === 'AbortError') return false;

}
/* Sends the report through the phone's share sheet in the richest form it accepts:
   Markdown file with photos, text file with photos, photos with the report as text,
   then the same without photos. Where the browser cannot share files (computers,
   most desktop browsers), the report and the photos are downloaded as separate files.
   wanted: how many photos the day has, so a shortfall can be explained. */
function shareReport(base, photos, wanted) {
  var attached = photos.map(function (f) { return f.name; });
  var missing = (wanted || 0) - photos.length;
  var downloadAll = function () {
    download(base + '.md', 'text/markdown', buildReport(attached));
    photos.forEach(function (f, i) { setTimeout(function () { downloadBlob(f.name, f); }, 400 * (i + 1)); });
    toast(photos.length ? 'Report and ' + plural(photos.length, 'photo', 'photos') + ' downloaded. Attach them all in Claude.'
      : 'Report downloaded. Attach it in Claude.');
  };
  var tries = [];
  if (isTouch() && navigator.share && navigator.canShare) {
    try {
      var md = function (names) { return new File([buildReport(names)], base + '.md', { type: 'text/markdown' }); };
      var txt = function (names) { return new File([buildReport(names)], base + '.txt', { type: 'text/plain' }); };
      if (photos.length) {
        tries.push({ files: [md(attached)].concat(photos), photos: true });
        tries.push({ files: [txt(attached)].concat(photos), photos: true });
        tries.push({ files: photos, text: buildReport(attached), photos: true });
      }
      tries.push({ files: [md([])] });
      tries.push({ files: [txt([])] });
    } catch (e) { tries = []; }
    tries.push({ text: buildReport([]) });
  }
  for (var i = 0; i < tries.length; i++) {
    var data = { title: base }, ok = false;
    if (tries[i].files) data.files = tries[i].files;
    if (tries[i].text) data.text = tries[i].text;
    try { ok = navigator.canShare(data); } catch (e) { ok = false; }
    if (!ok) continue;
    if (photos.length && !tries[i].photos) toast('This browser could not share the photos, so only the report was sent');
    else if (missing > 0) toast(plural(missing, 'photo is', 'photos are') + ' not stored in this browser, so not sent');
    return navigator.share(data).catch(function (err) {
      if (err && err.name === 'AbortError') return;     // closed by the user
      downloadAll();
    });
  }
  downloadAll();
  if (missing > 0) setTimeout(function () { toast(plural(missing, 'photo is', 'photos are') + ' not stored in this browser, so not included'); }, 4000);
  return Promise.resolve();
}

    return Store.load('photo:' + name).then(function (url) {
      if (!url) return null;
      var boundary = 'lifediaryphoto' + Date.now();
      var body = new Blob(['--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n',
        JSON.stringify({ name: name, mimeType: 'image/jpeg', parents: [meta.folderId] }),
        '\r\n--' + boundary + '\r\nContent-Type: image/jpeg\r\n\r\n', dataUrlToBlob(url), '\r\n--' + boundary + '--']);
      return api(UPLOAD + '?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + boundary }, body: body });
    });
  }
  function downloadPhoto(name, id) {
    return api(API + 'files/' + id + '?alt=media').then(function (r) { return r.blob(); }).then(blobToDataUrl)
      .then(function (url) { return Photos.add(name, url); });
  }
  /* Uploads pictures Drive lacks, fetches ones this device lacks, and moves pictures
     no meal uses any more to Drive's bin (where Google keeps them for a while). */
  function syncPhotos() {
    var wanted = mealPhotos(state), keep = Object.assign(mealPhotos(previousState), wanted);
    return Promise.all([listPhotos(), Photos.names()]).then(function (res) {
      var remote = res[0], local = {}, chain = Promise.resolve();
      res[1].forEach(function (n) { local[n] = 1; });
      Object.keys(wanted).forEach(function (n) {
        if (local[n] && !remote[n]) chain = chain.then(function () { return uploadPhoto(n); });
        else if (!local[n] && remote[n]) chain = chain.then(function () { return downloadPhoto(n, remote[n]); });
      });
      Object.keys(remote).forEach(function (n) {
        if (!keep[n] && !isEmpty(state)) {
          chain = chain.then(function () {
            return api(API + 'files/' + remote[n], { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ trashed: true }) });
          });
        }
      });
      return chain;
    });
  }

  /* One sync pass: compare this device with the Drive file and move the newer one across. */
  function run() {
    var loadEmail = meta.email ? Promise.resolve() : api(API + 'about?fields=user(emailAddress)').then(function (r) { return r.json(); })
      .then(function (j) { meta.email = (j.user && j.user.emailAddress) || ''; }, function (e) { if (e.auth) throw e; });
    return loadEmail.then(ensureFolder).then(function () {
      if (!meta.fileId) return null;
      return fetchRemote(meta.fileId).catch(function (e) { if (e.status === 404) { meta.fileId = ''; return null; } throw e; });
    }).then(function (remote) {
      if (remote || meta.fileId) return remote;
      return findFile().then(function (id) { if (!id) return null; meta.fileId = id; return fetchRemote(id); });
    }).then(function (remote) {
      deferred = false;
      if (!remote) return pushLocal();
      // This device lost its copy (for example the browser cleared its data): take Drive's.
      if (isEmpty(state) && !isEmpty(remote) && !meta.dirty) { adopt(remote); return null; }
      if (remote.modifiedAt === meta.remoteModifiedAt) return meta.dirty ? pushLocal() : null;
      // The Drive copy changed since this device last saw it.
      if (isEmpty(remote) && !isEmpty(state)) return pushLocal();
      if (!meta.dirty || isEmpty(state)) {
        if (sheet) { again = true; deferred = true; return null; }   // wait until the open form is closed
        adopt(remote);
        return null;
      }
      // Both changed. Only ask when the user started this sync; otherwise show a banner.
      if (!manual || sheet) { meta.conflict = true; return null; }
      return askConflict(remote);
    }).then(function () {
      // Photos follow the diary, so only once this device and Drive agree on it.
      return meta.conflict || deferred ? null : syncPhotos();
    });
  }
  function askConflict(remote) {
    return new Promise(function (resolve) {
      var done = false;
      openSheet({
        title: 'Two versions of your diary',
        autofocus: false,
        body: '<p>This device and Google Drive both changed since they last synced. Choose which one to keep. The other is replaced.</p>' +
          '<p class="cap">This device: ' + plural(daysWithEntries(state), 'day', 'days') + ' with entries, changed ' + agoLabel(state.modifiedAt) + '.<br>' +
          'Google Drive: ' + plural(daysWithEntries(remote), 'day', 'days') + ' with entries, changed ' + agoLabel(remote.modifiedAt) + '.</p>' +
          '<button type="button" class="btn primary block" data-act="conflictLocal">Keep this device</button>' +
          '<button type="button" class="btn block" data-act="conflictRemote">Keep Google Drive</button>',
        choose: function (which) {
          if (done) return; done = true;
          closeSheet();
          meta.conflict = false;
          render();   // the banner goes at once; photos may still be syncing
          if (which === 'local') resolve(pushLocal()); else { adopt(remote); resolve(null); }
        }
      });
      sheet.onClose = function () { if (!done) { done = true; meta.conflict = true; resolve(null); } };
    });
  }

  /* byUser is true when the person tapped Sync; timers and app start pass nothing. */
  function sync(byUser) {
    if (!CLIENT_ID || !meta.linked) return Promise.resolve();
    if (!tokenValid()) { render(); return Promise.resolve(); }
    if (busy) { again = true; return Promise.resolve(); }
    if (meta.conflict && !byUser) return Promise.resolve();
    busy = true; manual = !!byUser; lastError = ''; render();
    return run().then(function () { meta.lastSyncAt = Date.now(); }, function (e) {
      lastError = e.auth ? '' : (e.message === 'Failed to fetch' ? 'no connection' : e.message || 'no connection');
    }).then(function () {
      busy = false; manual = false; saveMeta(); render();
      if (again || (meta.dirty && !meta.conflict && tokenValid() && !lastError)) { again = false; schedule(1500); }
    });
  }
  function schedule(ms) { clearTimeout(timer); timer = setTimeout(function () { sync(false); }, ms); }

  return {
    configured: function () { return !!CLIENT_ID; },
    linked: function () { return !!CLIENT_ID && meta.linked; },
    needsSignIn: function () { return !!CLIENT_ID && meta.linked && !tokenValid(); },
    hasConflict: function () { return !!CLIENT_ID && meta.linked && meta.conflict && tokenValid(); },
    busy: function () { return busy; },
    error: function () { return lastError; },
    meta: function () { return meta; },
    connect: function () { beginAuth(false); },
    sync: sync,
    syncNow: function () { return sync(true); },
    handleReturn: handleReturn,
    localChanged: function () {
      if (!meta.linked) return;
      meta.dirty = true; saveMeta();
      if (tokenValid()) schedule(4000);
    },
    setAuto: function (on) { meta.auto = on; saveMeta(); },
    disconnect: function () {
      meta = Object.assign({}, blank); token = null; lastError = '';
      saveMeta(); lsSet('ld.token', null);
    },
    /* At start: renew an expired sign-in without asking, at most once every ten minutes. */
    start: function (cameBack) {
      if (!CLIENT_ID || !meta.linked) return;
      if (tokenValid()) { sync(false); return; }
      if (!cameBack && meta.auto && navigator.onLine !== false && Date.now() - meta.lastSilentAt > 600000) {
        meta.lastSilentAt = Date.now(); saveMeta();
        beginAuth(true);
      }
    },
    resumed: function () { if (meta.linked && tokenValid() && !busy && Date.now() - meta.lastSyncAt > 60000) sync(false); }
  };
})();

/* ----------------------------------------------------------------- actions */

var actions = {
  tab: function (d) {
    ui.tab = d.val;
    if (ui.showWeight) { ui.showWeight = false; leaveNav(); }
    if (d.val === 'history') ui.month = todayIso().slice(0, 7);
    render(); window.scrollTo(0, 0);
  },
  dismissTip: function () { lsSet('ld.tip', false); render(); },

  dayPrev: function () { ui.date = addDays(ui.date, -1); render(); },
  dayNext: function () { if (ui.date < todayIso()) { ui.date = addDays(ui.date, 1); render(); } },
  mood: function (d) {
    var level = Number(d.val), cur = state.moods.find(function (e) { return e.localDate === ui.date; });
    if (cur) removeFrom('moods', cur);
    if (!cur || cur.level !== level) state.moods.push({ localDate: ui.date, level: level, recordedAt: Date.now(), zoneOffset: currentOffset() });
    commit();
  },
  openSleep: function () { sleepSheet(); },
  openMeal: function (d) { mealSheet(d.id); },
  mealPhotoPick: function () { var input = document.getElementById('meal-photo-input'); if (input) input.click(); },
  mealPhotoRemove: function () { if (sheet) { sheet.photoNew = null; sheet.photoName = null; paintMealPhoto(); } },
  viewPhoto: function () {
    if (!sheet) return;
    if (sheet.photoNew) { openViewer(sheet.photoNew); return; }
    if (sheet.photoName) Photos.load(sheet.photoName).then(function (url) { if (url && !viewerOpen) openViewer(url); });
  },
  closeViewer: function () { closeViewer(); },
  openActivity: function () { activitySheet(); },
  pickActivity: function (d) { var input = document.querySelector('.sheet input[name="name"]'); if (input) input.value = d.val; },
  removeActivity: function (d) {
    var a = byId(state.activities, d.id);
    if (a) confirmSheet('Remove activity?', a.name + ', ' + a.durationMinutes + ' min', 'Remove', function () { removeFrom('activities', a); commit(); });
  },
  openNote: function (d) { noteSheet(d.kind); },
  customSet: function (d) {
    var t = byId(state.customTrackers, d.id), n = Number(d.val);
    var cur = state.customValues.find(function (v) { return v.trackerId === t.id && v.localDate === ui.date; });
    setCustomValue(t, cur && cur.numberValue === n ? null : n, null);
  },
  openCustomNumber: function (d) { customNumberSheet(d.id); },
  openCustomText: function (d) { customTextSheet(d.id); },
  openWeightScreen: function () { ui.showWeight = true; pushNav(); render(); window.scrollTo(0, 0); },

  monthPrev: function () { ui.month = addMonths(ui.month, -1); render(); },
  monthNext: function () { if (ui.month < todayIso().slice(0, 7)) { ui.month = addMonths(ui.month, 1); render(); } },
  colourBy: function (d) { ui.colourBy = d.val; render(); },
  openDay: function (d) { ui.date = d.date; ui.tab = 'today'; render(); window.scrollTo(0, 0); },

  period: function (d) { ui.period = d.val; render(); },
  periodPrev: function () { ui.anchor = shiftAnchor(ui.period, ui.anchor, -1); render(); },
  periodNext: function () { if (periodRange(ui.period, ui.anchor)[1] < todayIso()) { ui.anchor = shiftAnchor(ui.period, ui.anchor, 1); render(); } },
  shareReport: function () {
    var range = periodRange(ui.period, ui.anchor);
    var base = 'life-diary-report-' + range[0] + (range[0] === range[1] ? '' : '-to-' + range[1]);
    var names = ui.period === 'day' ? dayPhotoNames(range[0]) : [];
    var files = function () {
      var out = [];
      names.forEach(function (n) {
        var url = Photos.peek(n);
        if (url) { try { out.push(new File([dataUrlToBlob(url)], n, { type: 'image/jpeg' })); } catch (e) { /* no File support */ } }
      });
      return out;
    };
    // The day's photos are normally read in already, so the share sheet opens straight from the tap.
    // If one is not, read it first; most browsers still allow the share a moment later.
    if (names.every(function (n) { return Photos.peek(n); })) { shareReport(base, files(), names.length); return; }
    Promise.all(names.map(function (n) { return Photos.load(n); })).then(function () { shareReport(base, files(), names.length); });
  },
  copyReport: function () {
    copyText(buildReport()).then(function (ok) { toast(ok ? 'Report copied. Paste it into Claude.' : 'Could not copy. Use Share report instead.'); });
  },

  toggle: function (d) {
    var cur = state.settings.find(function (s) { return s.name === d.key; }), on = !isOn(d.key);
    if (cur) cur.value = on ? '1' : '0'; else state.settings.push({ name: d.key, value: on ? '1' : '0' });
    commit();
  },
  toggleCustom: function (d) { var t = byId(state.customTrackers, d.key); if (t) { t.enabled = !t.enabled; commit(); } },
  addTracker: function () { trackerSheet(null); },
  editTracker: function (d) { trackerSheet(d.id); },
  backup: function () {
    var count = Object.keys(mealPhotos(state)).length;
    if (!count) { saveBackup(backupText(null)); return; }
    openSheet({
      title: 'Back up diary', autofocus: false,
      body: '<p>Your diary has ' + plural(count, 'meal photo', 'meal photos') + '. Including them makes the backup complete, and the file larger.</p>' +
        '<div id="backup-step"><button type="button" class="btn primary block" data-act="backupWithPhotos">Include photos</button>' +
        '<button type="button" class="btn block mt8" data-act="backupTextOnly">Leave photos out</button></div>'
    });
  },
  backupTextOnly: function () { closeSheet(); saveBackup(backupText(null)); },
  /* Collecting photos takes a moment, and phones only open the share sheet straight after a tap,
     so the file is prepared first and saved with a second tap. */
  backupWithPhotos: function () {
    var form = sheet, step = document.getElementById('backup-step');
    var names = Object.keys(mealPhotos(state));
    step.innerHTML = '<p class="cap">Collecting photos…</p>';
    Promise.all(names.map(Photos.load)).then(function (urls) {
      var photos = {}, found = 0;
      names.forEach(function (n, i) { if (urls[i]) { photos[n] = urls[i]; found++; } });
      if (sheet !== form) return;
      form.prepared = backupText(photos);
      step.innerHTML = '<p>Backup ready: ' + plural(found, 'photo', 'photos') + ', about ' + fmt1(form.prepared.length / 1048576) + ' MB.</p>' +
        '<button type="button" class="btn primary block mt8" data-act="backupSave">Save backup file</button>';
    });
  },
  backupSave: function () { var text = sheet && sheet.prepared; closeSheet(); if (text) saveBackup(text); },
  restore: function () { document.getElementById('restore-file').click(); },
  undoReplace: function () {
    confirmSheet('Undo last replace?', 'The diary goes back to how it was before the last restore or Drive download.', 'Undo', function () {
      if (!previousState) { toast('Nothing to undo'); return; }
      var current = state;
      state = previousState; state.modifiedAt = Date.now();
      previousState = current;
      Store.save('diary', state); Store.save('previous', current);
      Drive.localChanged(); render(); toast('Previous diary brought back');
    });
  },
  driveConnect: function () { Drive.connect(); },
  driveSync: function () { Drive.syncNow(); },
  driveDisconnect: function () {
    confirmSheet('Disconnect Google Drive?', 'Syncing stops. Your diary stays on this device, and the file already in your Drive is left as it is.', 'Disconnect', function () { Drive.disconnect(); render(); });
  },
  driveAuto: function () { Drive.setAuto(!Drive.meta().auto); render(); },
  conflictLocal: function () { if (sheet && sheet.choose) sheet.choose('local'); },
  conflictRemote: function () { if (sheet && sheet.choose) sheet.choose('remote'); },

  weightBack: function () { ui.showWeight = false; leaveNav(); render(); window.scrollTo(0, 0); },
  weightRange: function (d) { ui.weightRange = d.val; render(); },
  addWeight: function () { weightSheet(null); },
  editWeight: function (d) { weightSheet(d.id); },

  closeSheet: function () { closeSheet(); },
  sheetExtra: function () { var s = sheet; closeSheet(); if (s && s.onExtra) s.onExtra(); }
};

document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el || el.disabled) return;
  var fn = actions[el.dataset.act];
  if (fn) fn(el.dataset, el);
});

/* ------------------------------------------------------------------- start */

Store.init().then(function () {
  return Promise.all([Store.load('diary'), Store.load('previous')]);
}).then(function (loaded) {
  if (loaded[0]) state = normalize(loaded[0]);
  previousState = loaded[1] ? normalize(loaded[1]) : null;
  cleanupPhotos();
  var returned = Drive.handleReturn();
  render();
  Drive.start(returned != null);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
});

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  // A new day may have started while the app was in the background.
  if (ui.tab === 'today' && !sheet && lsGet('ld.lastSeenDay', '') !== todayIso()) { ui.date = todayIso(); ui.anchor = todayIso(); render(); }
  lsSet('ld.lastSeenDay', todayIso());
  Drive.resumed();
});
lsSet('ld.lastSeenDay', todayIso());

if (!PREVIEW && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}

/* Used by the automated tests only. */
window.__lifeDiary = { getState: function () { return state; }, buildReport: buildReport, drive: Drive };

})();
</script>
</body>
</html>
